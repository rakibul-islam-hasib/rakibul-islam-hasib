<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" fill="none" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0D16"/>
      <stop offset="1" stop-color="#101626"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 130) scale(520 120)">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="120" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="120" fill="url(#bg)"/>
    <rect width="1200" height="120" fill="url(#glow)"/>
    <rect width="1200" height="3" fill="url(#bar)"/>
    <text x="600" y="58" class="sans" font-size="22" font-weight="700" fill="#F5F7FB" text-anchor="middle" letter-spacing="-0.4">Thanks for stopping by.</text>
    <text x="600" y="86" class="mono" font-size="13" fill="#6B7590" text-anchor="middle" letter-spacing="0.3">Let's build something worth shipping.</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="119" rx="19.5" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
