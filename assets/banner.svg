<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Rakibul Islam Hasib</title>
  <desc id="desc">Software Developer at AiOpsCamp. MERN stack, Next.js, TypeScript and React Native.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0D16"/>
      <stop offset="1" stop-color="#101626"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 70) scale(420 300)">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 380) scale(460 260)">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="windowStroke" x1="690" y1="70" x2="1130" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="400" rx="24"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }

    .drift-a { animation: drift-a 14s ease-in-out infinite alternate; }
    .drift-b { animation: drift-b 18s ease-in-out infinite alternate; }
    .pulse   { animation: pulse 2.4s ease-in-out infinite; transform-origin: 92px 100px; }
    .cursor  { animation: blink 1.1s steps(1) infinite; }

    @keyframes drift-a { from { transform: translate(0, 0); } to { transform: translate(-60px, 30px); } }
    @keyframes drift-b { from { transform: translate(0, 0); } to { transform: translate(70px, -25px); } }
    @keyframes pulse   { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes blink   { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .drift-a, .drift-b, .pulse, .cursor { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <!-- Canvas -->
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect class="drift-a" x="460" y="-240" width="900" height="640" fill="url(#glowViolet)"/>
    <rect class="drift-b" x="-340" y="120" width="920" height="520" fill="url(#glowCyan)"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <rect width="1200" height="1" fill="url(#edge)"/>

    <!-- Status pill -->
    <g>
      <rect x="72" y="82" width="246" height="36" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="92" cy="100" r="9" fill="#22C55E" fill-opacity="0.18" class="pulse"/>
      <circle cx="92" cy="100" r="4" fill="#22C55E"/>
      <text x="108" y="105" class="mono" font-size="13" fill="#A3AEC2" letter-spacing="0.4">Open to collaborations</text>
    </g>

    <!-- Name -->
    <text x="70" y="192" class="sans" font-size="62" font-weight="800" fill="#F5F7FB" letter-spacing="-2">Rakibul Islam</text>
    <text x="70" y="258" class="sans" font-size="62" font-weight="800" fill="url(#accent)" letter-spacing="-2">Hasib.</text>

    <!-- Role -->
    <text x="72" y="306" class="sans" font-size="20" fill="#C9D1E0">
      Software Developer <tspan fill="#6B7590">@</tspan> AiOpsCamp
    </text>
    <text x="72" y="340" class="mono" font-size="14" fill="#6B7590" letter-spacing="0.3">
      MERN  <tspan fill="#3B4560">/</tspan>  Next.js  <tspan fill="#3B4560">/</tspan>  TypeScript  <tspan fill="#3B4560">/</tspan>  React Native
    </text>

    <!-- Code window -->
    <g>
      <rect x="690" y="70" width="440" height="262" rx="16" fill="#0B1020" fill-opacity="0.82" stroke="url(#windowStroke)"/>
      <path d="M690 112 H1130" stroke="#ffffff" stroke-opacity="0.06"/>
      <circle cx="714" cy="91" r="6" fill="#FF5F57"/>
      <circle cx="734" cy="91" r="6" fill="#FEBC2E"/>
      <circle cx="754" cy="91" r="6" fill="#28C840"/>
      <text x="910" y="96" class="mono" font-size="13" fill="#6B7590" text-anchor="middle">hasib.ts</text>

      <g class="mono" font-size="15">
        <g fill="#3B4560" text-anchor="end">
          <text x="728" y="146">1</text>
          <text x="728" y="172">2</text>
          <text x="728" y="198">3</text>
          <text x="728" y="224">4</text>
          <text x="728" y="250">5</text>
          <text x="728" y="276">6</text>
          <text x="728" y="302">7</text>
        </g>

        <text x="748" y="146"><tspan fill="#C792EA">const</tspan><tspan fill="#82AAFF"> hasib</tspan><tspan fill="#89DDFF"> = {</tspan></text>
        <text x="776" y="172"><tspan fill="#E6EDF3">role</tspan><tspan fill="#89DDFF">: </tspan><tspan fill="#C3E88D">"Software Developer"</tspan><tspan fill="#89DDFF">,</tspan></text>
        <text x="776" y="198"><tspan fill="#E6EDF3">base</tspan><tspan fill="#89DDFF">: </tspan><tspan fill="#C3E88D">"Bangladesh"</tspan><tspan fill="#89DDFF">,</tspan></text>
        <text x="776" y="224"><tspan fill="#E6EDF3">stack</tspan><tspan fill="#89DDFF">: [</tspan><tspan fill="#C3E88D">"Next.js"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Node"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Mongo"</tspan><tspan fill="#89DDFF">],</tspan></text>
        <text x="776" y="250"><tspan fill="#E6EDF3">learning</tspan><tspan fill="#89DDFF">: </tspan><tspan fill="#C3E88D">"App Router"</tspan><tspan fill="#89DDFF">,</tspan></text>
        <text x="776" y="276"><tspan fill="#E6EDF3">curiosity</tspan><tspan fill="#89DDFF">: </tspan><tspan fill="#F78C6C">Infinity</tspan><tspan fill="#89DDFF">,</tspan></text>
        <text x="748" y="302"><tspan fill="#89DDFF">};</tspan></text>
        <rect class="cursor" x="770" y="289" width="9" height="17" rx="1" fill="#A78BFA"/>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="399" rx="23.5" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
